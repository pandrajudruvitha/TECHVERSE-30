services:
  - type: web
    name: techverse-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    dockerCommand: >-
      sh -c "alembic upgrade head && exec python -m uvicorn app.main:app
      --host 0.0.0.0 --port ${PORT:-8000}"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: techverse-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://${{techverse-web.RENDER_EXTERNAL_HOSTNAME}}

  - type: web
    name: techverse-web
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://${{techverse-api.RENDER_EXTERNAL_HOSTNAME}}

databases:
  - name: techverse-postgres
    databaseName: techverse
    user: techverse
    plan: free
    region: singapore
    postgresMajorVersion: "17"
